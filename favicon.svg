<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <style>
      .bg { fill: #4A5844; }
      .symbol { fill: none; stroke: #D2C19E; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .dot { fill: #D2C19E; }
    </style>
  </defs>

  <!-- Скругленный фон (цвет Sage) -->
  <rect class="bg" width="64" height="64" rx="16" />

  <!-- Элегантный абстрактный знак ростка / знака Пси (Ψ) -->
  <g transform="translate(0, 2)">
    <!-- Центральный стебель -->
    <line class="symbol" x1="32" y1="18" x2="32" y2="44" />
    <!-- Чаша / Чашелистник -->
    <path class="symbol" d="M 20 26 C 20 38, 44 38, 44 26" />
    <!-- Верхний акцентный бутон/точка -->
    <circle class="dot" cx="32" cy="14" r="2.5" />
  </g>
</svg>
